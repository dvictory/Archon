name: archon-fix-jira-ticket
description: |
  Use when: User wants to FIX, RESOLVE, or IMPLEMENT a solution for a Jira ticket.
  Triggers: "fix this ticket", "implement PROJ-123", "resolve this Jira", "fix it",
            "fix ticket", "resolve ticket", "fix jira", "fix PROJ-123".
  NOT for: GitHub issues (use archon-fix-github-issue),
           questions about tickets, CI failures, PR reviews, general exploration.

  Requires:
    - `npx` on PATH (Node.js — used to launch `mcp-remote`).
    - A one-time OAuth handshake with Atlassian's remote MCP. Run this once
      in a terminal to cache credentials in `~/.mcp-auth/`:
          npx -y mcp-remote https://mcp.atlassian.com/v1/mcp
      A browser window will open; sign in to the same Atlassian account
      that Claude Code uses. After that the workflow reuses the cached
      tokens silently — no env vars, no API tokens, no URLs to manage.

    The workflow talks to Atlassian's official remote MCP
    (https://mcp.atlassian.com/v1/mcp) — the same endpoint your Claude Code
    session uses. Multiple Atlassian sites are supported; the workflow looks
    up the right `cloudId` automatically via `getAccessibleAtlassianResources`.

  DAG workflow that:
  1. Extracts the Jira ticket key (e.g. PROJ-123) from the user request
  2. Fetches the ticket via the Atlassian remote MCP server
  3. Classifies the work (bug/feature/enhancement/etc)
  4. Researches context (web research + codebase exploration via investigate/plan)
  5. Routes to investigate (bugs) or plan (features) based on classification
  6. Implements the fix/feature with validation
  7. Creates a draft GitHub PR that references the Jira ticket
  8. Runs smart review (always code review + CLAUDE.md check, conditional additional agents)
  9. Aggressively self-fixes all findings (tests, docs, error handling)
  10. Simplifies changed code (implements fixes directly, not just reports)
  11. Final validation gate — lint, type-check, tests, format must ALL pass before push
  12. Posts a completion comment back to the Jira ticket with PR link and follow-ups

provider: claude
model: sonnet

nodes:
  # ═══════════════════════════════════════════════════════════════
  # PHASE 1: FETCH & CLASSIFY
  # ═══════════════════════════════════════════════════════════════

  - id: extract-ticket-key
    prompt: |
      Find the Jira ticket key for this request.

      Request: $ARGUMENTS

      Rules:
      - A Jira ticket key looks like `PROJECT-NUMBER` — uppercase letters, a hyphen, and digits (e.g. `PROJ-123`, `ABC-7`, `INFRA-2024`).
      - If the message contains an explicit key, extract it.
      - If the message contains a Jira URL (e.g. `https://acme.atlassian.net/browse/PROJ-123`), extract the key from the URL.
      - If the message is ambiguous and no key is present, fail with a clear error — do NOT guess.

      CRITICAL: Your final output must be ONLY the bare ticket key (uppercase, with hyphen) and nothing else. No quotes, no markdown, no explanation. Example correct output: PROJ-123
    allowed_tools: []
    model: haiku

  - id: fetch-ticket
    depends_on: [extract-ticket-key]
    mcp: /Users/dvictory/.archon/mcp/atlassian.json
    allowed_tools: [Bash, Write, Read]
    prompt: |
      Fetch a Jira ticket via the Atlassian remote MCP server, render it as
      markdown, and persist artifacts for downstream nodes.

      ## Step 1 — resolve the ticket key

      The previous node produced:

          $extract-ticket-key.output

      Normalize that output to a bare key matching `[A-Z][A-Z0-9_]+-[0-9]+`
      (strip quotes, whitespace, backticks). If no valid key can be extracted,
      **exit with a clear error message and do not call any tools**.

      ## Step 2 — look up the Atlassian cloudId

      Call `getAccessibleAtlassianResources` (no arguments). This returns a list
      of Atlassian sites the user has access to. Each entry has `id` (cloudId),
      `url` (site URL like `https://acme.atlassian.net`), `name`, and `scopes`.

      Pick the right site:
      - If exactly one site is returned, use it.
      - If multiple sites are returned, choose the one whose project prefix
        matches the ticket key (e.g. `PROJ-123` → site that contains project
        `PROJ`). If you cannot disambiguate, prefer the first entry whose
        scopes include Jira and surface a note in your final output that you
        guessed.

      Remember the chosen site's `id` (cloudId) and `url`.

      ## Step 3 — fetch the issue via MCP

      Call `getJiraIssue` with:
      - `cloudId`: the id from Step 2
      - `issueIdOrKey`: the resolved ticket key

      The tool returns the full Jira issue payload (fields, comments, etc).

      If either MCP call fails, surface the error verbatim and exit — do NOT
      fall back silently. The user needs to know auth or connectivity is broken.

      ## Step 4 — derive the ticket URL

      The browse URL is `<site url>/browse/<KEY>` using the `url` from Step 2.
      Strip any trailing slash from the site URL.

      ## Step 5 — write artifacts to $ARTIFACTS_DIR

      Use the `Write` tool to create:

      1. `$ARTIFACTS_DIR/.ticket-key` — the bare key, no trailing newline
      2. `$ARTIFACTS_DIR/.ticket-url` — the browse URL, no trailing newline
      3. `$ARTIFACTS_DIR/jira-ticket.json` — the raw MCP tool response as JSON
         (pretty-printed is fine)
      4. `$ARTIFACTS_DIR/jira-ticket.md` — the human-readable rendering described
         in Step 6

      `$ARTIFACTS_DIR` already exists; you can `mkdir -p` it defensively if needed.

      ## Step 6 — render markdown

      Build `jira-ticket.md` with this structure:

      ```
      # <KEY>: <summary>

      - URL: <browse URL>
      - Type: <issue type name>
      - Status: <status name>
      - Priority: <priority name or "unset">
      - Reporter: <display name>
      - Assignee: <display name or "unassigned">
      - Labels: <comma-separated, omit line if empty>
      - Components: <comma-separated names, omit line if empty>

      ## Description

      <description as plain markdown — if the field is Atlassian Document Format,
      convert it to readable markdown: paragraphs/headings/bullet lists/code blocks.
      If empty, write "(no description)".>

      ## Comments

      ### <author display name> — <created timestamp>

      <comment body as markdown>

      ### <next author> — <timestamp>

      <body>
      ```

      If the issue has no comments, omit the `## Comments` section entirely.

      ## Step 7 — final output

      Your **final message** (the value of `$fetch-ticket.output`) must be the
      contents of `jira-ticket.md` and **nothing else** — no preamble, no tool
      narration, no trailing summary. Downstream nodes substitute this output
      directly into their prompts.
    timeout: 60000

  - id: classify
    prompt: |
      You are a ticket classifier. Analyze the Jira ticket below and determine its type.

      ## Ticket Content

      $fetch-ticket.output

      ## Classification Rules

      | Type | Indicators |
      |------|------------|
      | bug | "broken", "error", "crash", "doesn't work", stack traces, regression, ticket type "Bug" |
      | feature | "add", "new", "support", "would be nice", net-new capability, ticket type "Story" / "New Feature" |
      | enhancement | "improve", "better", "update existing", "extend", incremental improvement |
      | refactor | "clean up", "simplify", "reorganize", "restructure" |
      | chore | "update deps", "upgrade", "maintenance", "CI/CD", ticket type "Task" with infra wording |
      | documentation | "docs", "readme", "clarify", "examples" |

      Use the ticket's `Type:` field as a strong signal but let the wording of summary and description override when they clearly indicate a different kind of work.

      Provide reasoning for your classification.
    depends_on: [fetch-ticket]
    model: haiku
    allowed_tools: []
    output_format:
      type: object
      properties:
        issue_type:
          type: string
          enum: ["bug", "feature", "enhancement", "refactor", "chore", "documentation"]
        title:
          type: string
        reasoning:
          type: string
      required: [issue_type, title, reasoning]

  # ═══════════════════════════════════════════════════════════════
  # PHASE 2: RESEARCH (web)
  # ═══════════════════════════════════════════════════════════════

  - id: web-research
    command: archon-web-research
    depends_on: [classify]
    context: fresh

  # ═══════════════════════════════════════════════════════════════
  # PHASE 3: INVESTIGATE (bugs) / PLAN (features)
  # Inlined as prompts so the Jira ticket data is passed in directly,
  # rather than relying on the GitHub-coupled archon-investigate-issue
  # / archon-create-plan commands.
  # ═══════════════════════════════════════════════════════════════

  - id: investigate
    prompt: |
      You are investigating a bug reported in a Jira ticket. Produce a thorough
      root-cause analysis and a remediation plan, then write it to
      `$ARTIFACTS_DIR/investigation.md` so downstream steps can read it.

      ## Jira Ticket

      $fetch-ticket.output

      ## Classification

      $classify.output

      ## Web Research (if available)

      $web-research.output

      ## Required Output File: $ARTIFACTS_DIR/investigation.md

      Structure the file with these sections:

      1. **Summary** — one-paragraph problem statement.
      2. **Reproduction** — exact steps to reproduce, expected vs actual behavior.
      3. **Root Cause Analysis** — code-level cause with file:line references.
         Use Read/Grep/Glob freely to inspect the codebase. Do NOT modify code yet.
      4. **Proposed Fix** — concrete plan: which files to change, what the change is,
         and why it addresses the root cause.
      5. **Risks & Side Effects** — what could break, which areas to test.
      6. **Validation Plan** — tests to add/run, manual verification steps.
      7. **Out of Scope** — anything we are deliberately NOT addressing in this fix.

      Be specific. Cite file paths and line numbers. Do not speculate where you can verify.

      Do NOT edit production code in this step — investigation only.
    depends_on: [classify, web-research]
    when: "$classify.output.issue_type == 'bug'"
    context: fresh

  - id: plan
    prompt: |
      You are creating an implementation plan for a Jira ticket that requests new
      functionality, an enhancement, refactor, chore, or documentation work. Write
      the plan to `$ARTIFACTS_DIR/plan.md` so downstream steps can read it.

      ## Jira Ticket

      $fetch-ticket.output

      ## Classification

      $classify.output

      ## Web Research (if available)

      $web-research.output

      ## Required Output File: $ARTIFACTS_DIR/plan.md

      Structure the file with these sections:

      1. **Goal** — one-paragraph statement of what we will deliver.
      2. **Context** — what's relevant in the codebase today (cite files/lines).
         Use Read/Grep/Glob freely to inspect the codebase. Do NOT modify code yet.
      3. **Approach** — step-by-step implementation plan, ordered. Each step lists
         files to create/modify and the change in plain English.
      4. **Acceptance Criteria** — how we know we're done (derive from the ticket).
      5. **Test Plan** — unit/integration tests to add, manual verification steps.
      6. **Risks & Open Questions** — known unknowns, areas that could break.
      7. **Out of Scope** — anything we are deliberately NOT addressing.

      Be specific. Cite file paths and line numbers. Prefer the smallest viable change
      that satisfies the ticket.

      Do NOT edit production code in this step — planning only.
    depends_on: [classify, web-research]
    when: "$classify.output.issue_type != 'bug'"
    context: fresh

  # Bridge: ensure investigation.md exists for the implement step
  # archon-fix-issue reads from $ARTIFACTS_DIR/investigation.md
  # The plan node writes to $ARTIFACTS_DIR/plan.md
  # This node copies plan.md → investigation.md when the plan path was taken
  - id: bridge-artifacts
    bash: |
      if [ -f "$ARTIFACTS_DIR/plan.md" ] && [ ! -f "$ARTIFACTS_DIR/investigation.md" ]; then
        cp "$ARTIFACTS_DIR/plan.md" "$ARTIFACTS_DIR/investigation.md"
        echo "Bridged plan.md to investigation.md for implement step"
      elif [ -f "$ARTIFACTS_DIR/investigation.md" ]; then
        echo "investigation.md exists from investigate step"
      else
        echo "WARNING: No investigation.md or plan.md found — implement may fail"
      fi
    depends_on: [investigate, plan]
    trigger_rule: one_success

  # ═══════════════════════════════════════════════════════════════
  # PHASE 4: IMPLEMENT
  # ═══════════════════════════════════════════════════════════════

  - id: implement
    command: archon-fix-issue
    depends_on: [bridge-artifacts]
    context: fresh
    model: claude-opus-4-6[1m]

  # ═══════════════════════════════════════════════════════════════
  # PHASE 5: VALIDATE
  # ═══════════════════════════════════════════════════════════════

  - id: validate
    command: archon-validate
    depends_on: [implement]
    context: fresh

  # ═══════════════════════════════════════════════════════════════
  # PHASE 6: CREATE DRAFT PR
  # ═══════════════════════════════════════════════════════════════

  - id: create-pr
    prompt: |
      Create a draft pull request for the current branch. The PR must reference the
      Jira ticket so it shows up in the Jira/GitHub integration.

      ## Context

      - **Jira ticket**: read the key from `$ARTIFACTS_DIR/.ticket-key` (e.g. `PROJ-123`)
      - **Jira ticket URL**: read from `$ARTIFACTS_DIR/.ticket-url`
      - **Classification**: $classify.output
      - **Ticket title**: $classify.output.title

      ## Instructions

      1. Read the ticket key and URL:
         ```bash
         TICKET_KEY=$(cat "$ARTIFACTS_DIR/.ticket-key")
         TICKET_URL=$(cat "$ARTIFACTS_DIR/.ticket-url")
         ```
      2. Check git status — ensure all changes are committed. If uncommitted changes exist, stage and commit them.
      3. Push the branch: `git push -u origin HEAD`
      4. Read implementation artifacts from `$ARTIFACTS_DIR/` for context:
         - `$ARTIFACTS_DIR/jira-ticket.md`
         - `$ARTIFACTS_DIR/investigation.md` or `$ARTIFACTS_DIR/plan.md`
         - `$ARTIFACTS_DIR/implementation.md`
         - `$ARTIFACTS_DIR/validation.md`
      5. Check if a PR already exists for this branch: `gh pr list --head $(git branch --show-current)`
         - If a PR exists, skip creation and capture its number.
      6. Look for the project's PR template at `.github/pull_request_template.md`,
         `.github/PULL_REQUEST_TEMPLATE.md`, or `docs/PULL_REQUEST_TEMPLATE.md`.
         Read whichever one exists.
      7. Create a DRAFT PR: `gh pr create --draft --base $BASE_BRANCH`
         - **Title**: prefix with the ticket key in brackets, then a concise imperative
           summary under 70 chars total. Example: `[PROJ-123] Fix expired session retry`
         - **Body**: if a PR template was found, fill in **every section** with details
           from the artifacts. Don't skip sections or leave placeholders.
           If no template, write a body with summary, changes, and validation evidence.
         - **Always** include a `Jira:` line linking to the ticket URL near the top of the body,
           e.g. `Jira: [PROJ-123](https://acme.atlassian.net/browse/PROJ-123)`. GitHub does
           not auto-close Jira tickets the way it closes its own issues, so do NOT use
           `Fixes #...` / `Closes #...` for the Jira key — just link to it.
      8. Capture PR identifiers:
         ```bash
         PR_NUMBER=$(gh pr view --json number -q '.number')
         echo "$PR_NUMBER" > "$ARTIFACTS_DIR/.pr-number"
         PR_URL=$(gh pr view --json url -q '.url')
         echo "$PR_URL" > "$ARTIFACTS_DIR/.pr-url"
         ```
    depends_on: [validate]
    context: fresh

  # ═══════════════════════════════════════════════════════════════
  # PHASE 7: REVIEW
  # ═══════════════════════════════════════════════════════════════

  - id: review-scope
    command: archon-pr-review-scope
    depends_on: [create-pr]
    context: fresh

  - id: review-classify
    prompt: |
      You are a PR review classifier. Analyze the PR scope and determine
      which review agents should run.

      ## PR Scope

      $review-scope.output

      ## Rules

      - **Code review**: ALWAYS run. This is mandatory for every PR. It also checks
        the PR against CLAUDE.md rules and project conventions.
      - **Error handling**: Run if the diff touches code with try/catch, error handling,
        async/await, or adds new failure paths.
      - **Test coverage**: Run if the diff touches source code (not just tests, docs, or config).
      - **Comment quality**: Run if the diff adds or modifies comments, docstrings, JSDoc,
        or significant documentation within code files.
      - **Docs impact**: Run if the diff adds/removes/renames public APIs, commands, CLI flags,
        environment variables, or user-facing features.

      Provide your reasoning for each decision.
    depends_on: [review-scope]
    model: haiku
    allowed_tools: []
    context: fresh
    output_format:
      type: object
      properties:
        run_code_review:
          type: string
          enum: ["true", "false"]
        run_error_handling:
          type: string
          enum: ["true", "false"]
        run_test_coverage:
          type: string
          enum: ["true", "false"]
        run_comment_quality:
          type: string
          enum: ["true", "false"]
        run_docs_impact:
          type: string
          enum: ["true", "false"]
        reasoning:
          type: string
      required:
        - run_code_review
        - run_error_handling
        - run_test_coverage
        - run_comment_quality
        - run_docs_impact
        - reasoning

  # Code review always runs — mandatory
  - id: code-review
    command: archon-code-review-agent
    depends_on: [review-classify]
    context: fresh

  - id: error-handling
    command: archon-error-handling-agent
    depends_on: [review-classify]
    when: "$review-classify.output.run_error_handling == 'true'"
    context: fresh

  - id: test-coverage
    command: archon-test-coverage-agent
    depends_on: [review-classify]
    when: "$review-classify.output.run_test_coverage == 'true'"
    context: fresh

  - id: comment-quality
    command: archon-comment-quality-agent
    depends_on: [review-classify]
    when: "$review-classify.output.run_comment_quality == 'true'"
    context: fresh

  - id: docs-impact
    command: archon-docs-impact-agent
    depends_on: [review-classify]
    when: "$review-classify.output.run_docs_impact == 'true'"
    context: fresh

  # ═══════════════════════════════════════════════════════════════
  # PHASE 8: SYNTHESIZE + SELF-FIX
  # ═══════════════════════════════════════════════════════════════

  - id: synthesize
    command: archon-synthesize-review
    depends_on: [code-review, error-handling, test-coverage, comment-quality, docs-impact]
    trigger_rule: one_success
    context: fresh

  - id: self-fix
    command: archon-self-fix-all
    depends_on: [synthesize]
    context: fresh

  # ═══════════════════════════════════════════════════════════════
  # PHASE 9: SIMPLIFY
  # ═══════════════════════════════════════════════════════════════

  - id: simplify
    command: archon-simplify-changes
    depends_on: [self-fix]
    context: fresh

  # ═══════════════════════════════════════════════════════════════
  # PHASE 10: FINAL VALIDATION GATE
  # Ensures lint, type-check, and tests all pass before pushing.
  # No code reaches GitHub until this gate is green.
  # ═══════════════════════════════════════════════════════════════

  - id: final-validate
    prompt: |
      You are a final validation gate. Your job is to ensure lint, type-check,
      and tests ALL pass before any code is pushed to GitHub.

      **CRITICAL**: Do NOT push code until every check passes. Fix issues in place.

      ## Step 0: Detect Monorepo Tool

      ```bash
      if [ -f nx.json ]; then echo "nx"; elif [ -f turbo.json ]; then echo "turbo"; else echo "standard"; fi
      ```

      Use the detected tool for type-check and test commands:
      - **nx**: `bun nx affected -t typecheck` / `bun nx affected -t test`
      - **turbo/standard**: `bun run type-check` / `bun run test`
      - **Lint**: Always `bun run lint` (root-level)

      ## Step 1: Run Lint

      ```bash
      bun run lint
      ```

      If it fails:
      1. Run `bun run lint:fix`
      2. Re-run `bun run lint`
      3. If still failing, manually fix remaining issues
      4. Repeat until `bun run lint` exits 0

      ## Step 2: Run Type Check

      ```bash
      # Monorepo-aware
      if [ -f nx.json ]; then bun nx affected -t typecheck; else bun run type-check; fi
      ```

      If it fails:
      1. Read the error output
      2. Fix type errors in the reported files
      3. Re-run until passing

      ## Step 3: Run Tests

      ```bash
      # Monorepo-aware
      if [ -f nx.json ]; then bun nx affected -t test; else bun run test; fi
      ```

      If tests fail:
      1. Identify which tests failed
      2. Determine if it's an implementation bug or test bug
      3. Fix the root cause
      4. Re-run until all tests pass

      ## Step 4: Run Format Check

      ```bash
      bun run format:check
      ```

      If it fails:
      1. Run `bun run format`
      2. Verify with `bun run format:check`

      ## Step 5: Commit and Push (only after ALL checks pass)

      Only after ALL four checks pass:

      ```bash
      git status --porcelain
      ```

      If there are uncommitted changes from fixes:
      ```bash
      git add {specific files that were fixed}
      git commit -m "chore: fix lint, type-check, and test issues"
      ```

      Then push:
      ```bash
      git push origin HEAD
      ```

      If push fails due to divergence:
      ```bash
      git pull --rebase origin $(git branch --show-current)
      git push origin HEAD
      ```

      ## Output

      Report the final status:

      ```
      ## Final Validation Gate

      | Check | Status |
      |-------|--------|
      | Lint | PASS/FAIL |
      | Type check | PASS/FAIL |
      | Tests | PASS/FAIL |
      | Format | PASS/FAIL |

      Pushed: YES/NO
      ```
    depends_on: [simplify]
    context: fresh

  # ═══════════════════════════════════════════════════════════════
  # PHASE 11: REPORT BACK TO JIRA
  # Posts a completion comment on the original Jira ticket via the
  # Atlassian remote MCP server. The MCP converts Markdown to Atlassian
  # Document Format internally, so we send Markdown directly.
  # ═══════════════════════════════════════════════════════════════

  - id: report
    depends_on: [final-validate]
    context: fresh
    mcp: /Users/dvictory/.archon/mcp/atlassian.json
    prompt: |
      You are posting a completion comment back to the originating Jira ticket.

      ## Sources of truth

      Read these before composing the comment:

      ```bash
      TICKET_KEY=$(cat "$ARTIFACTS_DIR/.ticket-key")
      TICKET_URL=$(cat "$ARTIFACTS_DIR/.ticket-url")
      PR_NUMBER=$(cat "$ARTIFACTS_DIR/.pr-number" 2>/dev/null || echo "unknown")
      PR_URL=$(cat "$ARTIFACTS_DIR/.pr-url" 2>/dev/null || echo "unknown")
      ```

      Read whichever of these artifacts exist:
      - `$ARTIFACTS_DIR/jira-ticket.md`
      - `$ARTIFACTS_DIR/investigation.md` or `$ARTIFACTS_DIR/plan.md`
      - `$ARTIFACTS_DIR/implementation.md`
      - `$ARTIFACTS_DIR/validation.md`
      - `$ARTIFACTS_DIR/review/consolidated-review.md`
      - `$ARTIFACTS_DIR/review/fix-report.md`

      ## Compose the report

      Write a markdown report to `$ARTIFACTS_DIR/completion-report.md` with these sections:

      1. **Summary** — one-paragraph plain-English description of what shipped.
      2. **Pull Request** — link with PR number and URL.
      3. **What was done** — bullet list of changes (files, behavior).
      4. **Validation** — what was tested and the result (lint, type-check, tests, format).
      5. **Review findings** — CRITICAL/HIGH issues found and how they were resolved (or
         why they remain).
      6. **Not addressed** — anything from the ticket explicitly left for follow-up,
         with a one-line reason.
      7. **Suggested follow-ups** — concrete next tickets, if any.

      ## Post the comment to Jira via MCP

      The Atlassian remote MCP is multi-tenant, so calls need a `cloudId`.

      1. Call `getAccessibleAtlassianResources` (no args). Pick the entry whose
         `url` matches the host portion of `TICKET_URL` (or, if only one entry
         is returned, use it). Remember its `id` (the cloudId).
      2. Call `addCommentToJiraIssue` with:
         - `cloudId`: the id from step 1
         - `issueIdOrKey`: the value of `TICKET_KEY`
         - `commentBody`: the full Markdown contents of
           `$ARTIFACTS_DIR/completion-report.md`

      The Atlassian MCP converts Markdown to Atlassian Document Format (ADF)
      internally — do NOT build ADF by hand and do NOT shell out to curl.

      If either MCP call fails, surface the error verbatim in your final response.
      Do NOT silently swallow failures — the user needs to know if the Jira comment
      didn't land.

      ## Final response to the user

      Print a short markdown summary as your final message:
      - Ticket key + URL
      - PR number + URL
      - Whether the Jira comment was posted successfully (include the comment ID
        returned by `addCommentToJiraIssue` if available)
      - Top 3 follow-up suggestions (if any)
