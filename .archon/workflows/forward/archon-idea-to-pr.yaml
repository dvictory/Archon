name: archon-idea-to-pr
description: |
  Use when: You have a feature idea or description and want end-to-end development.
  Input: Feature description in natural language, or path to a PRD file
  Output: PR ready for merge with comprehensive review completed

  Full workflow:
  1. Create comprehensive implementation plan with codebase analysis
  2. Setup branch and extract scope limits
  3. Verify plan research is still valid
  4. Implement all tasks with type-checking
  5. Run full validation suite
  6. CodeRabbit AI review against local branch with auto-fix (pre-push)
  7. Create PR with template, mark ready (first push to remote)
  8. Comprehensive code review (5 parallel agents with scope limit awareness)
  9. Synthesize and fix review findings
  10. Final summary with decision matrix -> GitHub comment + follow-up recommendations

  NOT for: Executing existing plans (use archon-plan-to-pr), quick fixes, standalone reviews.

nodes:
  # ═══════════════════════════════════════════════════════════════════
  # PHASE 0: CREATE PLAN
  # ═══════════════════════════════════════════════════════════════════

  - id: create-plan
    command: archon-create-plan
    context: fresh

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 1: SETUP
  # ═══════════════════════════════════════════════════════════════════

  - id: plan-setup
    command: archon-plan-setup
    depends_on: [create-plan]
    context: fresh

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 2: CONFIRM PLAN
  # ═══════════════════════════════════════════════════════════════════

  - id: confirm-plan
    command: archon-confirm-plan
    depends_on: [plan-setup]
    context: fresh

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 3: IMPLEMENT
  # ═══════════════════════════════════════════════════════════════════

  - id: implement-tasks
    command: archon-implement-tasks
    depends_on: [confirm-plan]
    context: fresh
    model: claude-opus-4-7[1m]

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 4: VALIDATE
  # ═══════════════════════════════════════════════════════════════════

  - id: validate
    command: archon-validate
    depends_on: [implement-tasks]
    context: fresh

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 5: CODERABBIT REVIEW (pre-push, local branch vs base)
  # ═══════════════════════════════════════════════════════════════════

  - id: coderabbit-review
    command: archon-coderabbit-review
    depends_on: [validate]
    context: fresh

  # Hard gate: types + tests must pass after CodeRabbit's fixes.
  - id: verify-after-coderabbit
    command: archon-verify-types-tests
    depends_on: [coderabbit-review]
    context: fresh

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 5.5: LINT FIX (pre-push guardrail before first push)
  # ═══════════════════════════════════════════════════════════════════

  - id: lint-fix-prepush
    command: archon-lint-fix
    depends_on: [verify-after-coderabbit]
    context: fresh

  # Hard gate: types + tests must pass after lint autofix. This is the
  # last gate before the first remote push (finalize-pr).
  - id: verify-prepush
    command: archon-verify-types-tests
    depends_on: [lint-fix-prepush]
    context: fresh

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 6: FINALIZE PR (first push + open PR)
  # ═══════════════════════════════════════════════════════════════════

  - id: finalize-pr
    command: archon-finalize-pr
    depends_on: [verify-prepush]
    context: fresh

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 7: CODE REVIEW
  # ═══════════════════════════════════════════════════════════════════

  - id: review-scope
    command: archon-pr-review-scope
    depends_on: [finalize-pr]
    context: fresh

  - id: sync
    command: archon-sync-pr-with-main
    depends_on: [review-scope]
    context: fresh

  - id: code-review
    command: archon-code-review-agent
    depends_on: [sync]
    context: fresh

  - id: error-handling
    command: archon-error-handling-agent
    depends_on: [sync]
    context: fresh

  - id: test-coverage
    command: archon-test-coverage-agent
    depends_on: [sync]
    context: fresh

  - id: comment-quality
    command: archon-comment-quality-agent
    depends_on: [sync]
    context: fresh

  - id: docs-impact
    command: archon-docs-impact-agent
    depends_on: [sync]
    context: fresh

  - id: synthesize
    command: archon-synthesize-review
    depends_on: [code-review, error-handling, test-coverage, comment-quality, docs-impact]
    trigger_rule: all_done
    context: fresh

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 8: FIX REVIEW ISSUES
  # ═══════════════════════════════════════════════════════════════════

  - id: implement-fixes
    command: archon-implement-review-fixes
    depends_on: [synthesize]
    context: fresh

  # Hard gate: types + tests must pass after review fixes.
  # implement-fixes pushes internally, so this gate runs post-push — its
  # value is surfacing whether the pushed state is actually green so the
  # workflow summary can report it clearly.
  - id: verify-after-fixes
    command: archon-verify-types-tests
    depends_on: [implement-fixes]
    context: fresh

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 9: FINAL SUMMARY & FOLLOW-UP
  # ═══════════════════════════════════════════════════════════════════

  - id: workflow-summary
    command: archon-workflow-summary
    depends_on: [verify-after-fixes]
    context: fresh
